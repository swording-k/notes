<svg xmlns="http://www.w3.org/2000/svg" width="460" height="520" viewBox="0 0 460 520">
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">
    <rect x="20" y="20" width="240" height="70" rx="16" fill="#FEE2E2"/>
    <text x="140" y="50">"那个需求啥时候</text>
    <text x="140" y="72">能上线？"</text>
    <rect x="200" y="120" width="220" height="70" rx="16" fill="#DBEAFE"/>
    <text x="310" y="150">"我上周说的改动</text>
    <text x="310" y="172">别忘了"</text>
    <rect x="30" y="220" width="230" height="70" rx="16" fill="#FEF3C7"/>
    <text x="145" y="250">"这个决策是谁拍的</text>
    <text x="145" y="272">板来着？"</text>
    <rect x="210" y="320" width="220" height="70" rx="16" fill="#E0F2FE"/>
    <text x="320" y="350">"新人接手完全</text>
    <text x="320" y="372">看不懂背景"</text>
    <rect x="40" y="420" width="240" height="70" rx="16" fill="#F1F5F9"/>
    <text x="160" y="450">"进度到底卡</text>
    <text x="160" y="472">在哪了？"</text>
    <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4">
      <line x1="120" y1="90" x2="320" y2="120"/>
      <line x1="310" y1="190" x2="160" y2="220"/>
      <line x1="150" y1="290" x2="330" y2="320"/>
      <line x1="320" y1="390" x2="170" y2="420"/>
    </g>
    <text x="230" y="505" font-size="14" fill="#94A3B8" text-anchor="middle">信息散落、无留存、难追溯</text>
  </g>
</svg>
