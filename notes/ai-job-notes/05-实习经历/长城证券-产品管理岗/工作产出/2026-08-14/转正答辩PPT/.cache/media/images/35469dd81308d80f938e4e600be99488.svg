<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1E293B" text-anchor="middle">
    <!-- boxes -->
    <g>
      <rect x="0" y="120" width="120" height="60" rx="10" fill="url(#g)"/>
      <text x="60" y="156" fill="#fff" font-size="18">建项目</text>
    </g>
    <g>
      <rect x="170" y="120" width="120" height="60" rx="10" fill="#E0F2FE"/>
      <text x="230" y="156" fill="#0369A1">建需求</text>
    </g>
    <g>
      <rect x="340" y="120" width="120" height="60" rx="10" fill="#E0F2FE"/>
      <text x="400" y="156" fill="#0369A1">拆任务</text>
    </g>
    <g>
      <rect x="510" y="120" width="120" height="60" rx="10" fill="#E0F2FE"/>
      <text x="570" y="156" fill="#0369A1">派活</text>
    </g>
    <g>
      <rect x="680" y="120" width="120" height="60" rx="10" fill="#E0F2FE"/>
      <text x="740" y="156" fill="#0369A1">填工时</text>
    </g>
    <g>
      <rect x="850" y="120" width="120" height="60" rx="10" fill="#E0F2FE"/>
      <text x="910" y="156" fill="#0369A1">记决策</text>
    </g>
    <g>
      <rect x="1010" y="120" width="110" height="60" rx="10" fill="#FEF3C7"/>
      <text x="1065" y="156" fill="#B45309">看进度·播报</text>
    </g>
    <!-- arrows -->
    <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="122" y1="150" x2="168" y2="150"/>
      <line x1="292" y1="150" x2="338" y2="150"/>
      <line x1="462" y1="150" x2="508" y2="150"/>
      <line x1="632" y1="150" x2="678" y2="150"/>
      <line x1="802" y1="150" x2="848" y2="150"/>
      <line x1="972" y1="150" x2="1008" y2="150"/>
    </g>
    <defs>
      <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
      </marker>
    </defs>
    <text x="560" y="40" font-size="22" font-weight="bold" fill="#1E3A8A">一句话在群里流转，表格自动落库、进度自动算</text>
    <text x="560" y="250" font-size="16" fill="#64748B">整条链路搬进飞书群，无需离开聊天界面手动登表</text>
  </g>
</svg>
